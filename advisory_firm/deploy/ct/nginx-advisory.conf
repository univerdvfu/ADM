server {
    listen 80 default_server;
    server_name _;
    auth_basic "advisory";
    auth_basic_user_file /etc/nginx/advisory.htpasswd;
    client_max_body_size 1m;
    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
    }
}
